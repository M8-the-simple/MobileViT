system:
  backend: "ViT_Tiny"          # or "ViT_Tiny"
  frame_skip: 5
  temporal_window: 5
  centroid_path: "centroids"
  dataset_path: "dataset"
detector:
    method: "mtcnn"             # or "haar"
    mtcnn:
      min_face_size: 40
      thresholds: [0.6, 0.6, 0.7]
      factor: 0.6
      selection_method: "probability"
    haar:
      path: "src/haarcascade_frontalface_default.xml"
      scale_factor: 1.1
      min_neighbors: 4
      min_size: [40,40]

preprocessing:
    use_clahe: false
    use_sharpen: false
    use_alignment: true

models:
    ViT_Tiny:
      name: "hf_hub:gaunernst/vit_tiny_patch8_112.arcface_ms1mv3"
      thresholds:
        Antonio: 0.46
        David: 0.5
        Ivor: 0.44
        Matej: 0.49
        Mathias: 0.42
        Matija: 0.62
        Paolo: 0.46
      quantization:
        enabled: false
      input_size: 112
        
        
    ConvNeXt:
      name: "hf_hub:gaunernst/convnext_atto.cosface_ms1mv3"
      thresholds:
        Antonio: 0.29
        David: 0.27
        Ivor: 0.28
        Matej: 0.31
        Mathias: 0.2
        Matija: 0.33
        Paolo : 0.32
      quantization:
        enabled: true
      input_size: 112

    MobileViT:
      name: "mobilevitv2_050.cvnets_in1k"
      thresholds:
